name: Build and test Sketchora

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Sketchora.sln
      - name: Build
        run: dotnet build Sketchora.sln -c Release --no-restore
      - name: Test lesson workflows and Windows adapters
        run: dotnet test Sketchora.sln -c Release --no-build --logger "trx;LogFileName=tests.trx"
      - name: Publish portable Windows app
        run: dotnet publish src/Sketchora.App/Sketchora.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/Sketchora-win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: Sketchora-win-x64
          path: artifacts/Sketchora-win-x64/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
